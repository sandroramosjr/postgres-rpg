[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postgres-rpg"
version = "1.0.0"
description = "Text-based RPG showcasing PostgreSQL and OOP in Python"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
postgres-rpg = "rpg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
